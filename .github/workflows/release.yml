name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Build bundle archive
        run: npm pack
      - name: Checksums
        run: sha256sum *.tgz > SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tgz
            SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
